# ======================================================================
# User Controlled Demo
# ======================================================================

klk2_all_topology_compact:
  task_type: denovo
  pdb_path: ./pdbs/design/klk2/klk2.pdb
  is_complex: true
  pep_chain: L
  hotspots: A124-125/A153/A155-156/A177-181
  motif_cfg: null
  lens_cfg:
    nres: [60]
    min_len: null
    max_len: null
    step_len: null
  constraint:
    cyclize: null
    spatial:
      - {begin_resid: 1,  end_resid: last, distance: 3.8}
      - {begin_resid: 8,  end_resid: 12, distance: 4.5}
      - {begin_resid: 18, end_resid: 21, distance: 5.5}
      - {begin_resid: 25, end_resid: 32, distance: 8.0}
      - {begin_resid: 25, end_resid: 38, distance: 8.0}
      - {begin_resid: 32, end_resid: 38, distance: 8.0}
      - {begin_resid: 42, end_resid: 49, distance: 10.5}
    restype:
      - {resid: 8,  aa: K}
      - {resid: 12, aa: E}
      - {resid: 18, aa: C}
      - {resid: 21, aa: C}
      - {resid: 25, aa: C}
      - {resid: 32, aa: C}
      - {resid: 38, aa: C}
      - {resid: 42, aa: MK8}
      - {resid: 49, aa: MK8}
  topology:
    - {type: head_to_tail, begin_resid: 1,  end_resid: last}
    - {type: isopep,       begin_resid: 8,  end_resid: 12}
    - {type: disulfide,  begin_resid: 18, end_resid: 21}
    - {type: bicyclic,   anchors: [25, 32, 38]}
    - {type: alkane_staple, anchors: [42, 49]}
  postprocess:
    enabled: true
    method: auto
  sample_num: 5

# ======================================================================
# CPSet Topology Docking Examples
# ======================================================================

# CPSet docking examples.
# Reference PDBs live in ./pdbs/cpset/{pdb_id}.pdb and keep CPSet chain/residue numbering.

cpset_3avb_head_tail:
  task_type: docking
  pdb_path: ./pdbs/cpset/3avb.pdb
  is_complex: true
  pep_chain: L
  hotspots: null
  motif_cfg: null
  lens_cfg: null
  # CPSet 3avb: head_tail; direct v2 topology
  # proxy_sequence: SLKIDNLD
  constraint:
    cyclize: null
    spatial:
      - {begin_resid: 1, end_resid: 8, distance: 3.8}
    restype: null
  topology:
    - {type: head_tail, begin_resid: 1, end_resid: 8}
  postprocess:
    enabled: true
    method: auto
  sample_num: 1

cpset_2yja_mk8_staple:
  task_type: docking
  pdb_path: ./pdbs/cpset/2yja.pdb
  is_complex: true
  pep_chain: A
  hotspots: null
  motif_cfg: null
  lens_cfg: null
  # CPSet 2yja: carbon_carbon_crosslink; MK8 C-C staple
  # proxy_sequence: HKMLHQMLQDS
  constraint:
    cyclize: null
    spatial:
      - {begin_resid: 3, end_resid: 7, distance: 6.1}
    restype:
      - {resid: 3, aa: MK8}
      - {resid: 7, aa: MK8}
  topology:
    - {type: mk8_staple, anchors: [3, 7]}
  postprocess:
    enabled: true
    method: auto
  sample_num: 1

cpset_6dn5_head_tail_passive_bal:
