[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "partiflow"
version = "0.1.0"
description = "PartiFlow peptide design workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "biotite==1.4.0", "PyYAML>=6,<7", "hydra-core==1.3.2", "omegaconf==2.3.0"]

[project.scripts]
partiflow = "partiflow.cli:main"

[tool.setuptools.packages.find]
include = ["partiflow*"]
exclude = ["partiflow._resources*"]

[tool.setuptools]
include-package-data = true
